<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChangeLiquid — справочник: единый экран</title>
<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-2: #EDF0F4;
    --surface-3: #E2E7ED;
    --on-surface: #12171D;
    --on-surface-variant: #4A545F;
    --outline: #7A8591;
    --outline-variant: #D5DBE2;
    --primary: #1A6DFF;
    --on-primary: #FFFFFF;
    --primary-container: #DCE6FF;
    --on-primary-container: #001A41;
    --error: #B3261E;
    --error-container: #FFDAD6;
    --shadow-sheet: 0 -8px 32px rgba(16, 24, 40, .18);
    --scrim: rgba(10, 14, 20, .48);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0E1216;
    --surface: #161C22;
    --surface-2: #1E252D;
    --surface-3: #28313A;
    --on-surface: #E7ECF1;
    --on-surface-variant: #AAB4BF;
    --outline: #8A95A1;
    --outline-variant: #36414C;
    --primary: #A8C3FF;
    --on-primary: #002E6E;
    --primary-container: #123A78;
    --on-primary-container: #DCE6FF;
    --error: #FFB4AB;
    --error-container: #3B1210;
    --shadow-sheet: 0 -10px 36px rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #20252B;
    color: #E7ECF1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 24px 64px;
  }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 20px; font-weight: 600; margin: 0 16px 0 0; }
  .toolbar p { margin: 0; color: #AAB4BF; font-size: 13px; }
  .btn {
    appearance: none; border: 1px solid #3B4450; background: #2A3138; color: #E7ECF1;
    border-radius: 9999px; padding: 10px 18px; font: inherit; font-size: 14px;
    font-weight: 500; cursor: pointer;
  }
  .frames { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption {
    text-align: center; font-size: 13px; color: #AAB4BF; margin-top: 14px;
    letter-spacing: .02em;
  }

  .phone {
    width: 360px; height: 760px; border-radius: 36px; overflow: hidden;
    background: var(--bg); color: var(--on-surface);
    border: 8px solid #14181D; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column; position: relative;
    font-size: 15px; line-height: 22px;
  }
  .statusbar {
    height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 12px; color: var(--on-surface-variant);
  }
  .appbar {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 4px 8px 6px; background: var(--surface);
    border-bottom: 1px solid var(--outline-variant);
  }
  .appbar h2 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; flex: 1; min-width: 0; padding-left: 4px; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 9999px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer;
    flex: none; text-decoration: none;
  }
  .iconbtn:active { background: var(--surface-2); }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; padding: 12px 16px 92px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  .tabs {
    display: flex; gap: 4px; overflow: hidden; padding: 0 4px;
    border-bottom: 1px solid var(--outline-variant); margin: 0 -4px 14px;
  }
  .tabs button {
    flex: none; width: 48px; height: 44px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tabs button.on { color: var(--primary); border-color: var(--primary); }

  .section-head { margin-bottom: 10px; }
  .section-head h3 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
  .section-head p { margin: 3px 0 0; font-size: 12.5px; line-height: 17px; color: var(--on-surface-variant); }

  .comp {
    display: flex; align-items: flex-start; gap: 6px;
    background: var(--surface); border: 1px solid var(--outline-variant);
    border-radius: 16px; margin-bottom: 8px; overflow: hidden;
  }
  .comp-main {
    flex: 1; min-width: 0; text-align: left; border: 0; background: transparent;
    color: inherit; font: inherit; cursor: pointer; padding: 11px 0 11px 14px;
  }
  .comp-main:active { background: var(--surface-2); }
  .comp-name { font-size: 14.5px; line-height: 19px; font-weight: 600; }
  .comp-km { font-size: 12.5px; line-height: 17px; color: var(--on-surface-variant); margin-top: 2px; }
  .comp-ref {
    font-size: 12.5px; line-height: 17px; color: var(--on-surface-variant); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .comp-ref.filled { color: var(--primary); }
  .notify {
    flex: none; width: 72px; align-self: stretch; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; padding: 8px 8px 8px 0;
    cursor: pointer; user-select: none;
  }
  .notify input {
    width: 20px; height: 20px; margin: 0; accent-color: var(--primary); cursor: pointer;
  }
  .notify span { font-size: 10.5px; line-height: 13px; color: var(--on-surface-variant); text-align: center; }

  .date-card {
    background: var(--surface); border: 1px solid var(--outline-variant);
    border-radius: 16px; padding: 12px 14px; margin-top: 4px;
  }
  .date-title { font-size: 14px; line-height: 19px; font-weight: 600; margin-bottom: 6px; }
  .check {
    display: flex; align-items: center; gap: 10px; min-height: 40px;
    font-size: 13.5px; color: var(--on-surface); cursor: pointer;
  }
  .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--primary); }

  .spoiler {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    background: var(--surface); border: 1px solid var(--outline-variant);
    border-radius: 16px; padding: 12px 14px; cursor: pointer;
  }
  .spoiler .main { flex: 1; min-width: 0; }
  .spoiler .name { font-size: 14px; font-weight: 600; }
  .spoiler .hint { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 1px; }
  .spoiler svg { color: var(--on-surface-variant); transition: transform .2s; }
  .spoiler.open svg { transform: rotate(180deg); }
  .spoiler-body { display: none; padding: 2px 4px 0; }
  .spoiler-body.open { display: block; }
  .spoiler-body .line { font-size: 12.5px; color: var(--on-surface-variant); padding: 4px 0; }

  .bottomnav {
    flex: none; height: 76px; display: flex; align-items: flex-start; justify-content: space-around;
    padding: 8px 18px 0; background: var(--surface); border-top: 1px solid var(--outline-variant);
  }
  .navitem {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; line-height: 13px; color: var(--on-surface-variant);
  }
  .navitem .pill {
    width: 58px; height: 30px; border-radius: 9999px; display: grid; place-items: center;
    color: var(--on-surface-variant);
  }
  .navitem.on { color: var(--primary); }
  .navitem.on .pill { background: var(--primary-container); color: var(--on-primary-container); }

  .scrim {
    position: absolute; inset: 0; background: var(--scrim); z-index: 20;
    display: none; align-items: flex-end;
  }
  .scrim.open { display: flex; }
  .sheet {
    width: 100%; max-height: 88%; display: flex; flex-direction: column;
    background: var(--surface); border-radius: 28px 28px 0 0;
    box-shadow: var(--shadow-sheet); overflow: hidden;
    animation: sheet-up .22s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(28px); opacity: .7; } to { transform: none; opacity: 1; } }
  .grabber { height: 16px; display: grid; place-items: center; flex: none; }
  .grabber i { display: block; width: 36px; height: 4px; border-radius: 9999px; background: var(--outline-variant); }
  .sheet-head {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 2px 12px 8px 20px;
  }
  .sheet-head h2 { flex: 1; margin: 0; font-size: 18px; line-height: 24px; }
  .sheet-body { overflow-y: auto; padding: 2px 20px 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; line-height: 16px; color: var(--on-surface-variant); margin-bottom: 5px; }
  .field input {
    width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--outline-variant);
    background: var(--surface-2); color: var(--on-surface); font: inherit; font-size: 14px; padding: 10px 12px;
  }
  .field input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 11.5px; line-height: 15px; color: var(--on-surface-variant); margin-top: 4px; }
  .reset {
    border: 0; background: transparent; color: var(--primary); font: inherit; font-size: 12px;
    padding: 4px 6px; border-radius: 8px; cursor: pointer;
  }
  .section-label {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 2px 0 6px; font-size: 12px; color: var(--on-surface-variant);
  }
  .add-link {
    border: 0; background: transparent; color: var(--primary); font: inherit; font-size: 12px;
    padding: 4px 6px; border-radius: 8px; cursor: pointer;
  }
  .variant {
    display: flex; gap: 6px; align-items: flex-start; margin-bottom: 8px;
  }
  .variant .fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .variant input { min-height: 42px; }
  .variant .remove {
    flex: none; width: 38px; height: 38px; margin-top: 2px; border: 0; border-radius: 9999px;
    background: transparent; color: var(--error); display: grid; place-items: center; cursor: pointer;
  }
  .variant .remove:active { background: var(--error-container); }
  .sheet-footer {
    flex: none; display: flex; gap: 8px; justify-content: flex-end;
    padding: 10px 16px 18px; border-top: 1px solid var(--outline-variant);
  }
  .text-btn {
    border: 0; background: transparent; color: var(--primary); font: inherit; font-weight: 600;
    min-height: 44px; padding: 0 14px; border-radius: 9999px; cursor: pointer;
  }
  .primary-btn {
    border: 0; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600;
    min-height: 44px; padding: 0 20px; border-radius: 9999px; cursor: pointer;
  }
  .toast {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
    background: #29313A; color: #fff; font-size: 12.5px; line-height: 17px;
    padding: 9px 14px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>Справочник — единый экран</h1>
    <p>12 компонентов · строки и шторка</p>
    <button class="btn" id="themeBtn" aria-pressed="false">Тёмная тема</button>
  </div>

  <div class="frames">
    <figure>
      <div class="phone" id="phone">
        <div class="statusbar"><span>9:41</span><span>5G · 84%</span></div>
        <div class="appbar">
          <a class="iconbtn" href="#" aria-label="Назад" onclick="return false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
          <h2>Volkswagen Golf</h2>
          <button class="iconbtn" aria-label="Поделиться">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.3M8.3 13.2l7.4 4.3"/></svg>
          </button>
          <button class="iconbtn" aria-label="Ещё">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </button>
        </div>

        <div class="body">
          <div class="scroll" id="scroll">
            <div class="tabs" role="tablist" aria-label="Разделы автомобиля">
              <button role="tab" aria-label="Замены (12)" title="Замены (12)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3s6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 6-10 6-10z"/><path d="M9 13a3 3 0 0 0 3 3"/></svg>
              </button>
              <button role="tab" aria-label="Шины (3)" title="Шины (3)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
              </button>
              <button role="tab" aria-label="Заправки (28)" title="Заправки (28)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M4 11h10"/><path d="M14 7h2l3 3v8a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-5h-1"/><path d="M3 21h12"/></svg>
              </button>
              <button role="tab" aria-label="Ремонт (6)" title="Ремонт (6)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14.5 6.5a4.5 4.5 0 0 0-5.9 5.9L4 17l3 3 4.6-4.6a4.5 4.5 0 0 0 5.9-5.9l-2.8 2.8-2.5-2.5 2.3-2.3z"/></svg>
              </button>
              <button role="tab" aria-label="Траты (4)" title="Траты (4)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
              </button>
              <button class="on" role="tab" aria-selected="true" aria-label="Справочник" title="Справочник">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h5"/></svg>
              </button>
            </div>

            <div class="section-head">
              <h3>Компоненты</h3>
              <p>Интервалы по умолчанию уже подставлены. Отметьте, о чём напоминать.</p>
            </div>

            <div id="componentList"></div>

            <div class="date-card">
              <div class="date-title">Напоминания по датам</div>
              <label class="check"><input type="checkbox" checked /><span>Шины</span></label>
              <label class="check"><input type="checkbox" checked /><span>Страховка</span></label>
              <label class="check"><input type="checkbox" checked /><span>Аренда машиноместа</span></label>
            </div>

            <div class="spoiler" id="sizesToggle" role="button" tabindex="0" aria-expanded="false">
              <div class="main">
                <div class="name">Колёса и диски</div>
                <div class="hint">Диски: 1 · Шины: 2</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="spoiler-body" id="sizesBody">
              <div class="line">Диск: R16 · 5x112 · ET 45–50 · 6.0–6.5 J</div>
              <div class="line">Шина: 205/55 R16 · лето</div>
              <div class="line">Шина: 205/55 R16 · зима</div>
            </div>
          </div>
        </div>

        <nav class="bottomnav" aria-label="Основная навигация">
          <div class="navitem on"><span class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16V9l2-4h12l2 4v7"/><path d="M4 16h16v3H4z"/><circle cx="7.5" cy="16" r="1.4"/><circle cx="16.5" cy="16" r="1.4"/></svg>
          </span>Гараж</div>
          <div class="navitem"><span class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          </span>Статистика</div>
          <div class="navitem"><span class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-3.2 4.4-5 8-5s6.4 1.8 8 5"/></svg>
          </span>Профиль</div>
        </nav>

        <div class="scrim" id="scrim">
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="grabber"><i></i></div>
            <div class="sheet-head">
              <h2 id="sheetTitle"></h2>
              <button class="iconbtn" id="sheetClose" aria-label="Закрыть">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <div class="sheet-body" id="sheetBody"></div>
            <div class="sheet-footer">
              <button class="text-btn" id="sheetCancel">Отмена</button>
              <button class="primary-btn" id="sheetSave">Сохранить</button>
            </div>
          </div>
        </div>

        <div class="toast" id="toast">Изменения сохранены</div>
      </div>
      <figcaption>Справочник: все компоненты, уведомления и данные в одной строке</figcaption>
    </figure>
  </div>

<script>
  const components = [
    {
      key: 'engine_oil', name: 'Моторное масло', km: 7000, months: 12,
      volume: '5,7', variants: [
        { name: '0W-20', approvals: 'VW 508 00, API SP' },
        { name: '5W-30', approvals: 'VW 504 00, BMW LL-04' },
      ], note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'transmission_oil', name: 'Масло АКПП', km: 60000, months: 60,
      volume: '', variants: [{ name: 'Toyota ATF WS', approvals: '' }],
      note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'brake_fluid', name: 'Тормозная жидкость', km: 40000, months: 24,
      volume: '1', variants: [{ name: 'DOT 4', approvals: 'ISO 4925' }],
      note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'coolant', name: 'Антифриз', km: 60000, months: 24,
      volume: '', variants: [], note: '', supportsVolume: true, notify: false,
    },
    {
      key: 'power_steering_fluid', name: 'Жидкость ГУР', km: 40000, months: 60,
      volume: '', variants: [], note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'differential_oil', name: 'Масло в редукторе (зад)', km: 50000, months: 60,
      volume: '', variants: [{ name: '75W-90 GL-5', approvals: '' }],
      note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'differential_oil_front', name: 'Масло в редукторе (перед)', km: 50000, months: 60,
      volume: '', variants: [], note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'transfer_case_oil', name: 'Масло в раздатке', km: 50000, months: 60,
      volume: '', variants: [], note: '', supportsVolume: true, notify: true,
    },
    {
      key: 'cabin_filter', name: 'Фильтр салона', km: 15000, months: 12,
      volume: '', variants: [{ name: 'MANN CUK 2643', approvals: 'угольный' }],
      note: '', supportsVolume: false, notify: true,
    },
    {
      key: 'spark_plugs', name: 'Свечи зажигания', km: 45000, months: 24,
      volume: '', variants: [{ name: 'NGK BKR6E', approvals: '' }],
      note: '', supportsVolume: false, notify: false,
    },
    {
      key: 'air_filter', name: 'Воздушный фильтр', km: 10000, months: 12,
      volume: '', variants: [], note: '', supportsVolume: false, notify: true,
    },
    {
      key: 'fuel_filter', name: 'Топливный фильтр', km: 50000, months: 24,
      volume: '', variants: [{ name: 'Bosch F026403850', approvals: '' }],
      note: '', supportsVolume: false, notify: true,
    },
  ];

  const list = document.getElementById('componentList');
  const scrim = document.getElementById('scrim');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetBody = document.getElementById('sheetBody');
  const toast = document.getElementById('toast');
  let activeKey = null;
  let toastTimer = null;

  const kmFmt = value => String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  function summary(item) {
    const parts = [];
    if (item.volume) parts.push(item.volume.replace('.', ',') + ' л');
    const names = item.variants.map(v => v.name).filter(Boolean);
    if (names.length) parts.push(names.join(', '));
    return parts.length ? parts.join(' · ') : 'Данные не заполнены';
  }

  function renderList() {
    list.innerHTML = components.map(item => {
      const ref = summary(item);
      return `
        <article class="comp" data-key="${item.key}">
          <button class="comp-main" type="button" aria-label="Изменить: ${item.name}">
            <div class="comp-name">${item.name}</div>
            <div class="comp-km">${kmFmt(item.km)} км${item.months ? ` · ${item.months} мес` : ''}</div>
            <div class="comp-ref${ref === 'Данные не заполнены' ? '' : ' filled'}">${ref}</div>
          </button>
          <label class="notify" title="Уведомлять: ${item.name}">
            <input type="checkbox" ${item.notify ? 'checked' : ''} data-notify="${item.key}" aria-label="Уведомлять: ${item.name}" />
            <span>Уведомлять</span>
          </label>
        </article>`;
    }).join('');
  }

  function variantRow(variant = { name: '', approvals: '' }) {
    return `
      <div class="variant">
        <div class="fields">
          <input type="text" maxlength="100" placeholder="0W-20" value="${variant.name}" data-variant="name" />
          <input type="text" maxlength="300" placeholder="Допуски: VW 504 00" value="${variant.approvals}" data-variant="approvals" />
        </div>
        <button type="button" class="remove" aria-label="Удалить вариант">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
  }

  function openSheet(key) {
    const item = components.find(entry => entry.key === key);
    if (!item) return;
    activeKey = key;
    sheetTitle.textContent = item.name;

    const variants = item.variants.length ? item.variants : [{ name: '', approvals: '' }];
    sheetBody.innerHTML = `
      <div class="grid2">
        <div class="field">
          <label>Интервал, км</label>
          <input type="number" min="0" inputmode="numeric" id="fieldKm" value="${item.km}" />
        </div>
        <div class="field">
          <label>Интервал, мес</label>
          <input type="number" min="0" inputmode="numeric" placeholder="—" id="fieldMonths" value="${item.months ?? ''}" />
        </div>
      </div>
      <div class="hint" style="margin-top:-8px;display:flex;align-items:center;justify-content:space-between">
        <span>По умолчанию: ${kmFmt(item.km)} км / ${item.months ?? '—'} мес</span>
        <button type="button" class="reset" id="resetInterval">Сбросить</button>
      </div>
      <label class="check" style="margin:6px 0 14px">
        <input type="checkbox" id="fieldNotify" ${item.notify ? 'checked' : ''} />
        <span>Уведомлять о замене</span>
      </label>
      ${item.supportsVolume ? `
        <div class="field">
          <label>Заправочный объём, л</label>
          <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="5.7" id="fieldVolume" value="${item.volume}" />
        </div>` : ''}
      <div class="field">
        <label>Заметка</label>
        <input type="text" maxlength="500" placeholder="Например: с фильтром / без фильтра" id="fieldNote" value="${item.note}" />
      </div>
      <div class="section-label">
        <span>${item.supportsVolume ? 'Варианты и допуски' : 'Название и допуски'}</span>
        <button type="button" class="add-link" id="addVariant">+ Вариант</button>
      </div>
      <div id="variantList">${variants.map(variantRow).join('')}</div>
    `;

    document.getElementById('resetInterval').addEventListener('click', () => {
      document.getElementById('fieldKm').value = '0';
      document.getElementById('fieldMonths').value = '';
    });
    document.getElementById('addVariant').addEventListener('click', () => {
      document.getElementById('variantList').insertAdjacentHTML('beforeend', variantRow());
    });
    document.getElementById('variantList').addEventListener('click', event => {
      const button = event.target.closest('.remove');
      if (button) button.closest('.variant').remove();
    });

    scrim.classList.add('open');
  }

  function closeSheet() {
    scrim.classList.remove('open');
    activeKey = null;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function saveSheet() {
    const item = components.find(entry => entry.key === activeKey);
    if (!item) return;
    item.km = Number(document.getElementById('fieldKm').value) || 0;
    item.months = document.getElementById('fieldMonths').value === ''
      ? null
      : Number(document.getElementById('fieldMonths').value) || 0;
    item.notify = document.getElementById('fieldNotify').checked;
    if (item.supportsVolume) {
      item.volume = document.getElementById('fieldVolume').value;
    }
    item.note = document.getElementById('fieldNote').value;
    item.variants = [...document.querySelectorAll('#variantList .variant')]
      .map(row => ({
        name: row.querySelector('[data-variant="name"]').value.trim(),
        approvals: row.querySelector('[data-variant="approvals"]').value.trim(),
      }))
      .filter(variant => variant.name !== '');
    renderList();
    closeSheet();
    showToast('Компонент обновлён');
  }

  list.addEventListener('click', event => {
    const checkbox = event.target.closest('[data-notify]');
    if (checkbox) {
      const item = components.find(entry => entry.key === checkbox.dataset.notify);
      if (item) item.notify = checkbox.checked;
      showToast(checkbox.checked ? 'Уведомление включено' : 'Уведомление выключено');
      return;
    }
    const row = event.target.closest('.comp-main');
    if (row) openSheet(row.closest('.comp').dataset.key);
  });

  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetCancel').addEventListener('click', closeSheet);
  document.getElementById('sheetSave').addEventListener('click', saveSheet);
  scrim.addEventListener('click', event => {
    if (event.target === scrim) closeSheet();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && scrim.classList.contains('open')) closeSheet();
  });

  const sizesToggle = document.getElementById('sizesToggle');
  const sizesBody = document.getElementById('sizesBody');
  sizesToggle.addEventListener('click', () => {
    const open = sizesToggle.classList.toggle('open');
    sizesBody.classList.toggle('open', open);
    sizesToggle.setAttribute('aria-expanded', String(open));
  });

  document.getElementById('themeBtn').addEventListener('click', event => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark';
    root.dataset.theme = dark ? 'light' : 'dark';
    event.currentTarget.setAttribute('aria-pressed', String(!dark));
    event.currentTarget.textContent = dark ? 'Тёмная тема' : 'Светлая тема';
  });

  renderList();

  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') {
    document.documentElement.dataset.theme = 'dark';
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.setAttribute('aria-pressed', 'true');
    themeBtn.textContent = 'Светлая тема';
  }
  if (params.get('sheet')) {
    requestAnimationFrame(() => openSheet(params.get('sheet')));
  }
</script>
</body>
</html>
