<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChangeLiquid — макеты Android-редизайна</title>
<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-2: #EDF0F4;
    --surface-3: #E2E7ED;
    --on-surface: #12171D;
    --on-surface-variant: #4A545F;
    --outline: #7A8591;
    --outline-variant: #D5DBE2;
    --primary: #1A6DFF;
    --on-primary: #FFFFFF;
    --primary-container: #DCE6FF;
    --on-primary-container: #001A41;
    --attention: #B26A00;
    --error: #B3261E;
    --on-error: #FFFFFF;
    --error-container: #FFDAD6;
    --on-error-container: #410002;
    --good-bg: #E4F6E9; --good-fg: #1B7F3B;
    --warning-bg: #FFF3D6; --warning-fg: #8A6100;
    --critical-bg: #FFE9D9; --critical-fg: #9A4B00;
    --overdue-bg: #FFDAD6; --overdue-fg: #B3261E;
    --unknown-bg: #EDF0F4; --unknown-fg: #4A545F;
    --shadow-fab: 0 6px 18px rgba(16, 24, 40, .22);
    --shadow-sheet: 0 -8px 32px rgba(16, 24, 40, .18);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0E1216;
    --surface: #161C22;
    --surface-2: #1E252D;
    --surface-3: #28313A;
    --on-surface: #E7ECF1;
    --on-surface-variant: #AAB4BF;
    --outline: #8A95A1;
    --outline-variant: #36414C;
    --primary: #A8C3FF;
    --on-primary: #002E6E;
    --primary-container: #123A78;
    --on-primary-container: #DCE6FF;
    --attention: #F2C66D;
    --error: #FFB4AB;
    --on-error: #690005;
    --error-container: #3B1210;
    --on-error-container: #FFDAD6;
    --good-bg: #12301F; --good-fg: #7FD79A;
    --warning-bg: #33270A; --warning-fg: #F2C66D;
    --critical-bg: #3A2210; --critical-fg: #FFB27A;
    --overdue-bg: #3B1210; --overdue-fg: #FFB4AB;
    --unknown-bg: #1E252D; --unknown-fg: #AAB4BF;
    --shadow-fab: 0 8px 24px rgba(0, 0, 0, .5);
    --shadow-sheet: 0 -10px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #20252B;
    color: #E7ECF1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 24px 64px;
  }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 20px; font-weight: 600; margin: 0 16px 0 0; }
  .btn {
    appearance: none; border: 1px solid #3B4450; background: #2A3138; color: #E7ECF1;
    border-radius: 9999px; padding: 10px 18px; font: inherit; font-size: 14px;
    font-weight: 500; cursor: pointer;
  }
  .btn[aria-pressed="true"] { background: #1A6DFF; border-color: #1A6DFF; color: #fff; }
  .frames { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption {
    text-align: center; font-size: 13px; color: #AAB4BF; margin-top: 14px;
    letter-spacing: .02em;
  }
  .phone {
    width: 360px; height: 760px; border-radius: 36px; overflow: hidden;
    background: var(--bg); color: var(--on-surface);
    border: 8px solid #14181D; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column; position: relative;
    font-size: 15px; line-height: 22px;
  }
  .statusbar {
    height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 12px; color: var(--on-surface-variant);
  }
  .appbar {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px 12px; background: var(--surface);
    border-bottom: 1px solid var(--outline-variant);
  }
  .appbar h2 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; flex: 1; }
  .logo { display: flex; align-items: center; gap: 10px; flex: 1; }
  .logo b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .mark {
    width: 34px; height: 34px; border-radius: 11px; background: var(--primary-container);
    color: var(--on-primary-container); display: grid; place-items: center;
  }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 9999px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer;
    flex: none; text-decoration: none;
  }
  .iconbtn.accent { background: var(--primary-container); color: var(--on-primary-container); }
  .iconbtn .dot {
    position: absolute; width: 9px; height: 9px; border-radius: 9999px;
    background: var(--good-fg); border: 2px solid var(--surface);
  }
  .iconbtn { position: relative; }
  .dot-top { top: 6px; right: 6px; }
  .body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: hidden; padding: 16px 16px 96px; }
  .segmented {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
    background: var(--surface-2); border-radius: 14px; margin-bottom: 16px;
  }
  .segmented span {
    text-align: center; padding: 9px 8px; border-radius: 10px; font-size: 13px;
    font-weight: 500; color: var(--on-surface-variant);
  }
  .segmented .on { background: var(--surface); color: var(--on-surface); box-shadow: 0 1px 3px rgba(16,24,40,.12); }

  .vcard {
    display: flex; gap: 12px; padding: 14px 14px 14px 0; background: var(--surface);
    border: 1px solid var(--outline-variant); border-radius: 20px; margin-bottom: 12px;
    position: relative; overflow: hidden;
  }
  .rail { width: 4px; flex: none; border-radius: 0 4px 4px 0; margin-right: 12px; }
  .rail.good { background: var(--good-fg); }
  .rail.warning { background: var(--warning-fg); }
  .rail.critical { background: var(--critical-fg); }
  .rail.overdue { background: var(--overdue-fg); }
  .rail.unknown { background: var(--outline); }
  .vmain { flex: 1; min-width: 0; }
  .vtitle { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .vtitle strong { font-size: 17px; line-height: 24px; font-weight: 600; }
  .vmeta { font-size: 13px; line-height: 18px; color: var(--on-surface-variant); margin-top: 1px; }
  .next {
    display: flex; align-items: center; gap: 7px; margin-top: 8px;
    padding: 7px 10px; border-radius: 10px; background: var(--surface-2);
    font-size: 12.5px; line-height: 17px; color: var(--on-surface-variant);
  }
  .next b { color: var(--on-surface); font-weight: 500; }
  .next.tone-warning { background: var(--warning-bg); color: var(--warning-fg); }
  .next.tone-critical { background: var(--critical-bg); color: var(--critical-fg); }
  .next.tone-overdue { background: var(--overdue-bg); color: var(--overdue-fg); }
  .next.tone-good { background: var(--good-bg); color: var(--good-fg); }
  .more { width: 36px; height: 36px; border-radius: 9999px; display: grid; place-items: center; color: var(--on-surface-variant); margin: -4px -4px 0 0; }
  .muted { color: var(--on-surface-variant); }
  .ref-heading { margin: 0 0 10px; font-size: 16px; line-height: 22px; font-weight: 600; }

  .hero {
    background: var(--surface); border: 1px solid var(--outline-variant);
    border-radius: 20px; padding: 16px; margin-bottom: 14px;
  }
  .hero .statusline { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
    border-radius: 9999px; font-size: 12px; font-weight: 600; line-height: 16px;
  }
  .badge.critical { background: var(--critical-bg); color: var(--critical-fg); }
  .badge.warning { background: var(--warning-bg); color: var(--warning-fg); }
  .badge.overdue { background: var(--overdue-bg); color: var(--overdue-fg); }
  .badge.good { background: var(--good-bg); color: var(--good-fg); }
  .badge.primary { background: var(--primary-container); color: var(--on-primary-container); margin-top: 4px; }
  .add-car {
    width: 100%; min-height: 48px; margin: 2px 0 4px; border: 0; cursor: pointer;
    border-radius: 9999px; background: var(--primary-container); color: var(--on-primary-container);
    font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .odo { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 2px; }
  .hero .sub { font-size: 13px; color: var(--on-surface-variant); }
  .bar { height: 6px; border-radius: 9999px; background: var(--surface-3); margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 9999px; background: var(--critical-fg); width: 68%; }
  .barlabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-surface-variant); margin-top: 6px; }

  .tabs {
    display: flex; gap: 4px; overflow: hidden; padding: 0 4px;
    border-bottom: 1px solid var(--outline-variant); margin-bottom: 14px; flex: none;
  }
  .tabs button {
    flex: none; width: 48px; height: 44px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tabs button.on { color: var(--primary); border-color: var(--primary); }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--surface); border: 1px solid var(--outline-variant);
    border-radius: 16px; margin-bottom: 8px;
  }
  .row .name { font-size: 14.5px; font-weight: 500; }
  .row .desc { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 2px; }
  .row .right { margin-left: auto; text-align: right; flex: none; }
  .row .right b { font-size: 14px; font-weight: 600; }
  .row .right span { display: block; font-size: 12px; color: var(--on-surface-variant); }
  .avatar {
    width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: var(--surface-2); color: var(--on-surface-variant);
  }
  .avatar.critical { background: var(--critical-bg); color: var(--critical-fg); }
  .avatar.warning { background: var(--warning-bg); color: var(--warning-fg); }

  .bottomnav {
    flex: none; height: 76px; background: var(--surface); border-top: 1px solid var(--outline-variant);
    display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px 10px;
  }
  .navitem {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--on-surface-variant); font-size: 11.5px; font-weight: 500;
  }
  .navitem .pill {
    width: 64px; height: 30px; border-radius: 9999px; display: grid; place-items: center;
    position: relative;
  }
  .navitem .nav-dot {
    position: absolute; top: 1px; right: 12px; width: 9px; height: 9px;
    border-radius: 9999px; background: var(--error); border: 2px solid var(--surface);
  }
  .navitem.on { color: var(--on-primary-container); }
  .navitem.on .pill { background: var(--primary-container); }

  .fab {
    position: absolute; right: 18px; bottom: 92px; width: 56px; height: 56px;
    border-radius: 19px; background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; box-shadow: var(--shadow-fab);
  }
  .dim { position: absolute; inset: 0; background: rgba(10, 14, 18, .44); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-radius: 28px 28px 0 0; box-shadow: var(--shadow-sheet);
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: none;
  }
  .handle { width: 36px; height: 4px; border-radius: 9999px; background: var(--outline-variant); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 12px 4px; font-size: 18px; line-height: 24px; font-weight: 600; }
  .sheet-sub { margin: 0 0 12px 4px; font-size: 13px; color: var(--on-surface-variant); }
  .action {
    display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 4px;
    border-radius: 14px;
  }
  .action + .action { border-top: 1px solid var(--outline-variant); border-radius: 0; }
  .action .glyph {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    display: grid; place-items: center; background: var(--surface-2); color: var(--on-surface-variant);
  }
  .action .glyph.blue { background: var(--primary-container); color: var(--on-primary-container); }
  .action .label { font-size: 15px; font-weight: 500; }
  .action .chev { margin-left: auto; color: var(--outline); }
  .src { font-size: 12px; color: #8B96A3; text-align: center; margin-top: 26px; }
  @media (max-width: 420px) {
    body { padding: 16px 10px 40px; }
    .phone { width: 100%; max-width: 360px; height: 720px; }
    .frames { gap: 28px; }
  }
</style>
</head>
